name = "validaimovel-payment-api"
account_id = "d003fd1278d4195c835a16fb7c65f9b7"
main = "src/index.ts"
compatibility_date = "2026-07-28"
compatibility_flags = ["nodejs_compat"]

workers_dev = true

# Mantém as variáveis criadas no painel (ex.: FIRST_ACCESS_EMAILS, que fica fora do repositório público)
keep_vars = true

routes = [
  { pattern = "api.validaimovel.com", custom_domain = true }
]

# Keep-alive diário do Supabase (08:00 em Brasília)
[triggers]
crons = ["0 11 * * *"]

[vars]
ENVIRONMENT = "production"
ASAAS_API_URL = "https://api.asaas.com/v3"
ADMIN_EMAILS = "elizandro.aquino@outlook.com"

# Logs persistentes (Workers Logs) para investigar erros de clientes e do webhook
[observability]
enabled = true

# Limites por usuário (IA), por IP (criação de cobranças) e por IP (registro de erros do site)
[[ratelimits]]
name = "AI_LIMITER"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "PAYMENT_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "ERROR_LIMITER"
namespace_id = "1003"
simple = { limit = 10, period = 60 }

# Ambiente de testes: `wrangler deploy --env sandbox` (só no workers.dev, sem domínio próprio)
[env.sandbox]
name = "validaimovel-payment-api-sandbox"
workers_dev = true
routes = [] # sem isto o ambiente herda o domínio api.validaimovel.com de produção

[env.sandbox.triggers]
crons = []

[env.sandbox.vars]
ENVIRONMENT = "sandbox"
ASAAS_API_URL = "https://api-sandbox.asaas.com/v3"
ADMIN_EMAILS = "elizandro.aquino@outlook.com"

[[env.sandbox.ratelimits]]
name = "AI_LIMITER"
namespace_id = "2001"
simple = { limit = 20, period = 60 }

[[env.sandbox.ratelimits]]
name = "PAYMENT_LIMITER"
namespace_id = "2002"
simple = { limit = 10, period = 60 }

[[env.sandbox.ratelimits]]
name = "ERROR_LIMITER"
namespace_id = "2003"
simple = { limit = 10, period = 60 }
