<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="darkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Container de Fundo Escuro Esmeralda -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#darkGrad)" stroke="#10b981" stroke-width="2.5" />

  <!-- Silhueta de Escudo Registral -->
  <path d="M32 10 L48 16 V30 C48 40 32 49 32 49 C32 49 16 40 16 30 V16 L32 10 Z" fill="url(#emeraldGrad)" opacity="0.25" />

  <!-- Ícone de Documento Matrícula -->
  <rect x="22" y="18" width="20" height="2" rx="1" fill="#94a3b8" />
  <rect x="22" y="23" width="14" height="2" rx="1" fill="#94a3b8" />

  <!-- Símbolo de Verificação Registrária (Checkmark) -->
  <path d="M21 34 L29 42 L43 25" fill="none" stroke="url(#emeraldGrad)" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#shadow)" />
</svg>
